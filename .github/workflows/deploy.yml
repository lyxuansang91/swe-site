name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # leetcode-algorithms is a submodule under content/, so its own pushes do not
  # touch this repo. Its gitbook.yml workflow fires this dispatch instead, and
  # the build below pulls the submodule's latest main. The other three sections
  # live in this repo, so editing them is an ordinary push.
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # The pinned submodule commit is only a floor: the site should always
      # publish the newest LeetCode solutions, including on a content-updated
      # dispatch fired seconds after they landed. The pointer in this repo is
      # deliberately not committed back — nothing here depends on it being current.
      - name: Use the latest LeetCode content
        run: git submodule update --remote --recursive content/leetcode-algorithms

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build site
        # Runs scripts/prepare.sh over content/ and mkdocs build into ./site
        run: bash build.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=swe-site --branch=main
