name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Content repos (leetcode-algorithms, swe, real-interview-questions) fire this
  # via repository_dispatch
  # from their own trigger-site-deploy workflows.
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build site
        # Clones the content repos and runs mkdocs build into ./site
        run: bash build.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=swe-site --branch=main
